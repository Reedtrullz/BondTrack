services:
  heimdall:
    # Production compose is a manual/diagnostic path. Set IMAGE_SHA to the
    # exact short SHA that passed CI; compose adds the immutable sha- prefix.
    image: ghcr.io/reedtrullz/heimdall:sha-${IMAGE_SHA:?Set IMAGE_SHA=<7-40 lowercase hex short SHA>}
    container_name: heimdall
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - /opt/apps/heimdall/data:/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - VERSION=sha-${IMAGE_SHA:?Set IMAGE_SHA=<7-40 lowercase hex short SHA>}
      # NEXT_PUBLIC_* values are baked into browser JS during Docker build.
      # These runtime entries document the production contract for server-side
      # rendering/diagnostics; changing them here cannot mutate an existing
      # image's client bundle.
      - NEXT_PUBLIC_THORNODE_API=https://gateway.liquify.com/chain/thorchain_api
      - NEXT_PUBLIC_MIDGARD_API=https://gateway.liquify.com/chain/thorchain_midgard
      - NEXT_PUBLIC_THORCHAIN_RPC=https://gateway.liquify.com/chain/thorchain_rpc
      - NEXT_PUBLIC_TRACK_API=https://track.thorchain.org/
      - NEXT_PUBLIC_MIDGARD_FALLBACK=https://midgard.thorchain.network
      - NEXT_PUBLIC_APP_URL=https://bond.thorchain.no
      - NEXT_PUBLIC_THORCHAIN_NETWORK=mainnet
      - NEXT_PUBLIC_COINGECKO_API=https://api.coingecko.com/api/v3
      - NEXT_PUBLIC_USE_MOCK_DATA=false
      - THORNODE_API_URL=https://gateway.liquify.com/chain/thorchain_api/thorchain
      - MIDGARD_API_URL=https://gateway.liquify.com/chain/thorchain_midgard
      - MIDGARD_FALLBACK_URL=https://midgard.thorchain.network
      # Trust only the Caddy-overwritten X-Real-IP header by default. Leave
      # TRUST_X_FORWARDED_FOR=false unless the full proxy chain sanitizes it.
      - TRUST_PROXY_HEADERS=true
      - TRUST_X_FORWARDED_FOR=false
      - HEIMDALL_DATA_DIR=/data
      - NOTIFICATION_POLL_INTERVAL_MS=60000
      - WEB_PUSH_VAPID_PUBLIC_KEY=${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      - WEB_PUSH_VAPID_PRIVATE_KEY=${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      - WEB_PUSH_CONTACT=${WEB_PUSH_CONTACT:-mailto:alerts@bond.thorchain.no}
      - HEIMDALL_NOTIFICATION_RUNNER_TOKEN=${HEIMDALL_NOTIFICATION_RUNNER_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

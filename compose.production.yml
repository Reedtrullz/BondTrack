services:
  heimdall:
    image: ghcr.io/reedtrullz/heimdall:latest
    container_name: heimdall
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - VERSION=dev
      - NEXT_PUBLIC_THORNODE_API=https://gateway.liquify.com/chain/thorchain_api
      - NEXT_PUBLIC_MIDGARD_API=https://gateway.liquify.com/chain/thorchain_midgard
      - NEXT_PUBLIC_THORCHAIN_RPC=https://rpc.thorchain.network
      - NEXT_PUBLIC_MIDGARD_FALLBACK=https://midgard.thorchain.network
      - NEXT_PUBLIC_THORCHAIN_NETWORK=mainnet
      - NEXT_PUBLIC_COINGECKO_API=https://api.coingecko.com
      - THORNODE_API_URL=https://gateway.liquify.com/chain/thorchain_api/thorchain
      - MIDGARD_API_URL=https://gateway.liquify.com/chain/thorchain_midgard
      - MIDGARD_FALLBACK_URL=https://midgard.thorchain.network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

name: CI

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: ./.github/actions/install-deps
      # Moderate+ production vulnerabilities should fail CI; omit dev deps to avoid tool noise.
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint -- --max-warnings=0
      - run: npm test
        env:
          CI: true
        timeout-minutes: 5
      - run: npm run test:coverage
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: ./.github/actions/install-deps
      - run: npm run build
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-output-${{ github.sha }}
          path: .next/
          if-no-files-found: ignore

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: ./.github/actions/install-deps
      - run: npx playwright install --with-deps
      - run: npm run e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore

  docker-build:
    name: Docker build verification
    needs: [test, build, e2e]
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image version
        run: echo "IMAGE_VERSION=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build image without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ghcr.io/reedtrullz/heimdall:${{ env.IMAGE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
            NEXT_PUBLIC_THORNODE_API=https://gateway.liquify.com/chain/thorchain_api
            NEXT_PUBLIC_MIDGARD_API=https://gateway.liquify.com/chain/thorchain_midgard
            NEXT_PUBLIC_THORCHAIN_RPC=https://rpc.thorchain.info
            NEXT_PUBLIC_MIDGARD_FALLBACK=https://midgard.thorchain.network
            NEXT_PUBLIC_THORCHAIN_NETWORK=mainnet
            NEXT_PUBLIC_COINGECKO_API=https://api.coingecko.com/api/v3

  publish:
    name: Build & publish image
    needs: [test, build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image version
        run: echo "IMAGE_VERSION=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.IMAGE_VERSION }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
            NEXT_PUBLIC_THORNODE_API=https://gateway.liquify.com/chain/thorchain_api
            NEXT_PUBLIC_MIDGARD_API=https://gateway.liquify.com/chain/thorchain_midgard
            NEXT_PUBLIC_THORCHAIN_RPC=https://rpc.thorchain.info
            NEXT_PUBLIC_MIDGARD_FALLBACK=https://midgard.thorchain.network
            NEXT_PUBLIC_THORCHAIN_NETWORK=mainnet
            NEXT_PUBLIC_COINGECKO_API=https://api.coingecko.com/api/v3

      - name: Summary
        run: |
          echo "### Image published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tags:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull with: \`docker pull ghcr.io/${{ github.repository }}:${{ env.IMAGE_VERSION }}\`" >> $GITHUB_STEP_SUMMARY

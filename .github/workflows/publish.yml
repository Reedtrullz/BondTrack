name: Publish

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [master]
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NEXT_PUBLIC_THORNODE_API: https://gateway.liquify.com/chain/thorchain_mainnet
  NEXT_PUBLIC_MIDGARD_API: https://gateway.liquify.com/chain/thorchain_mainnet
  NEXT_PUBLIC_COINGECKO_API: https://api.coingecko.com/api/v3
  NEXT_PUBLIC_THORCHAIN_NETWORK: mainnet

jobs:
  publish:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.name == 'CI/CD Pipeline')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Build and push
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.img.outputs.name }}"
          SHA_TAG="sha-$(echo "${{ github.sha }}" | cut -c1-7)"
          docker build \
            --file ./Dockerfile.v2 \
            --build-arg NEXT_PUBLIC_THORNODE_API=${{ env.NEXT_PUBLIC_THORNODE_API }} \
            --build-arg NEXT_PUBLIC_MIDGARD_API=${{ env.NEXT_PUBLIC_MIDGARD_API }} \
            --build-arg NEXT_PUBLIC_COINGECKO_API=${{ env.NEXT_PUBLIC_COINGECKO_API }} \
            --build-arg NEXT_PUBLIC_THORCHAIN_NETWORK=${{ env.NEXT_PUBLIC_THORCHAIN_NETWORK }} \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$SHA_TAG" \
            .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHA_TAG"

      - name: Verify image published
        run: |
          echo "✅ Image published to: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}"
          echo "Monitor at: https://github.com/${{ github.repository }}/pkgs/container/heimdall"

name: CI/CD Pipeline

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
        env:
          CI: true
      - run: npm run test:coverage
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Start dev server
        run: npm run dev &
      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000
      - run: npm run e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output-${{ github.sha }}
          path: .next/

  # Report CI status (deployment handled separately by Coolify)
  report-status:
    needs: [test, e2e, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check CI status
        run: |
          echo "CI Status Summary:"
          echo "Test job: ${{ needs.test.result }}"
          echo "E2E job: ${{ needs.e2e.result }}"
          echo "Build job: ${{ needs.build.result }}"
          
          if [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.e2e.result }}" = "success" ] && \
             [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ CI passed! Coolify will auto-deploy via webhook."
            echo "Monitor at: https://cool.reidar.tech"
          else
            echo "❌ CI failed! Deployment skipped."
            exit 1
          fi

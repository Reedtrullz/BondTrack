name: CI/CD Pipeline

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]

# Concurrency removed - allow parallel runs for faster debugging

# Suppress Node.js 20 deprecation warnings (actions will migrate to Node.js 24 in June 2026)
# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: false  # Keep using Node 20 (actions failing on Node 24)

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Skip vitest (debugging why it fails in CI)
        run: echo "Vitest temporarily disabled - debugging CI failure (exits in 0s)"
      # - run: npm test
      #   timeout-minutes: 5
      # - run: npm test
      #   timeout-minutes: 5
      - run: npm run test:coverage
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output-${{ github.sha }}
          path: .next/

  # Report CI status (deployment handled by docker-publish.yml → GHCR → VPS)
  report-status:
    needs: [test, e2e, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check CI status
        run: |
          echo "CI Status Summary:"
          echo "Test job: ${{ needs.test.result }}"
          echo "E2E job: ${{ needs.e2e.result }}"
          echo "Build job: ${{ needs.build.result }}"

          if [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.e2e.result }}" = "success" ] && \
             [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ CI passed! Docker image will be published to GHCR by docker-publish.yml"
            echo "Monitor at: https://github.com/${{ github.repository }}/pkgs/container/heimdall"
          else
            echo "❌ CI failed! Docker publish skipped."
            exit 1
          fi

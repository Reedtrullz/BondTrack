- name: Deploy Heimdall to VPS
  hosts: vps
  gather_facts: false
  vars:
    docker_image: "ghcr.io/reedtrullz/heimdall:latest"
    container_name: "heimdall"
    image_tag: "{{ lookup('env', 'GITHUB_SHA') | default('latest') }}"

  tasks:
    - name: Pull latest image from GHCR
      community.docker.docker_image:
        name: "{{ docker_image }}"
        source: pull

    - name: Stop and remove existing container
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent

    - name: Start new container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_image }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "127.0.0.1:3001:3000"
        log_driver: "json-file"
        log_options:
          max-size: "10m"
          max-file: "3"
        healthcheck:
          test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', r => process.exit(r.statusCode === 200 ? 0 : 1))\""]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 40s
        env:
          NODE_ENV: production
          PORT: "3000"
          HOSTNAME: "0.0.0.0"
          VERSION: "{{ image_tag }}"
          NEXT_PUBLIC_THORNODE_API: "{{ thornode_api | default('https://gateway.liquify.com/chain/thorchain_api') }}"
          NEXT_PUBLIC_MIDGARD_API: "{{ midgard_api | default('https://gateway.liquify.com/chain/thorchain_midgard') }}"
          NEXT_PUBLIC_THORCHAIN_RPC: "{{ thorchain_rpc | default('https://rpc.thorchain.info') }}"
          NEXT_PUBLIC_TRACK_API: "{{ track_api | default('https://track.thorchain.org/') }}"
          NEXT_PUBLIC_MIDGARD_FALLBACK: "{{ midgard_fallback | default('https://midgard.thorchain.network') }}"

    - name: Wait for application to become healthy
      uri:
        url: "http://localhost:3001/api/health"
        return_content: yes
        timeout: 5
      register: health_check
      until: health_check is succeeded and health_check.json.status == "healthy"
      retries: 10
      delay: 5
      failed_when: false

    - name: Fail if application is not healthy
      fail:
        msg: "Heimdall health check failed: {{ health_check }}"
      when: health_check is not succeeded or health_check.json.status != "healthy"

    - name: Verify container is running
      community.docker.docker_container_info:
        name: "{{ container_name }}"
      register: container_info

    - name: Report deployment status
      debug:
        msg: "✅ Heimdall deployed successfully: {{ container_info.container.State.Status }}"
